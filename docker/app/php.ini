; PHP settings for the container (the official image ships without a php.ini).

; Errors go to the log (the container's stderr), never into responses: with display_errors on,
; PHP printed its "POST Content-Length exceeds" warning as a 200 text/html page before Laravel ran.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; No endpoint takes more than a few kilobytes; larger bodies get Laravel's 413 payload_too_large.
post_max_size = 1M
upload_max_filesize = 1M
