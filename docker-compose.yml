name: gethookd

x-app-env: &app-env
  APP_KEY: ${APP_KEY:?run `make up`, which creates .env with an APP_KEY}
  APP_ENV: local
  LOG_CHANNEL: stderr
  DB_HOST: postgres
  DB_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gethookd
      POSTGRES_USER: gethookd
      POSTGRES_PASSWORD: gethookd-local-only
    ports:
      # Loopback only: the dev Postgres role is a superuser with a committed password, and Redis has no
      # password, so neither may be reachable from the network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gethookd -d gethookd"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: gethookd-app
    environment:
      <<: *app-env
      # PHP's built-in server with a few workers: enough for local use, the page and the MCP server.
      MCP_PUBLIC_URL: http://localhost:${MCP_HOST_PORT:-3001}/mcp
      PHP_CLI_SERVER_WORKERS: "4"
    command: ["sh", "-c", "php artisan migrate --force && exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 2s
      timeout: 3s
      retries: 60

  mcp:
    image: gethookd-app
    working_dir: /repo/mcp
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3001"
      V1_BASE_URL: http://api:8000
      # Host headers the MCP server answers (DNS-rebinding protection): how clients reach it from this machine.
      MCP_ALLOWED_HOSTS: localhost:${MCP_HOST_PORT:-3001},127.0.0.1:${MCP_HOST_PORT:-3001}
    command: ["npx", "tsx", "src/main.ts"]
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
