name: gethookd

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gethookd
      POSTGRES_USER: gethookd
      POSTGRES_PASSWORD: gethookd-local-only
    ports:
      # Loopback only: the dev Postgres role is a superuser with a committed password, and Redis has no
      # password, so neither may be reachable from the network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gethookd -d gethookd"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
